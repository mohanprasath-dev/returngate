services:
  - type: web
    name: returngate
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: VISION_DAILY_CAP
        value: "250"
      - key: VISION_PER_IP_HOURLY
        value: "10"
      - key: WORKSPACE_REFUND_CAP_CENTS
        value: "5000"
      - key: NEXT_PUBLIC_SANDBOX_BUYER_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SANDBOX_BUYER_PASSWORD
        sync: false
